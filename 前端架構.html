<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四維系統 - 智慧排班與記帳</title>
    <!-- 引入 Tailwind CSS（class 模式的深淺色切換） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        // 在畫面繪製前先套用已記憶的主題，避免閃白
        (function () {
            try {
                if (localStorage.getItem('life_grid_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* 提升觸控流暢度，避免雙擊縮放延遲 */
        * { touch-action: manipulation; }
        /* 自訂細scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#0f172a] min-h-screen text-slate-800 dark:text-slate-100 transition-colors pb-10">

    <!-- 主容器 -->
    <div class="max-w-[98%] xl:max-w-[1450px] mx-auto p-2 sm:p-4">

        <!-- 只在 Vercel（沒有 google.script.run）時由前端打開 -->
        <div id="gas-url-panel" class="hidden bg-white dark:bg-[#1e293b] rounded-2xl shadow-sm p-4 mb-3 border border-amber-300 dark:border-slate-700">
            <label for="gas-url-input" class="block text-xs font-bold text-amber-900 dark:text-amber-400 mb-1">GAS Web App 網址（Vercel 連線用）</label>
            <div class="flex flex-col md:flex-row gap-2">
                <input id="gas-url-input" type="url" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-base md:text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none min-h-[44px]" placeholder="https://script.google.com/macros/s/部署ID/exec">
                <input id="gas-key-input" type="password" autocomplete="off" class="w-full md:w-72 border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-base md:text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none min-h-[44px]" placeholder="API 密鑰">
                <button type="button" onclick="saveGasWebAppUrl()" class="min-h-[44px] px-5 py-2.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white dark:text-slate-900 text-sm font-bold rounded-xl shadow transition whitespace-nowrap">儲存連線</button>
            </div>
            <p id="gas-url-status" class="mt-2 text-xs text-slate-600 dark:text-slate-400"></p>
        </div>

        <!-- 頂部導覽控制列 -->
        <div class="bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm p-3 sm:p-4 mb-3 flex flex-col gap-3">

            <!-- 第一列：模式切換 + 功能按鈕 (清單/月曆切換、主題切換) -->
            <div class="flex flex-wrap items-center justify-between gap-2">
                <!-- 班表模式切換 (固定輪班 / 隨機排班) -->
                <div class="flex gap-1.5 bg-slate-100 dark:bg-[#0f172a] p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                    <button id="btn-fixed" onclick="switchMode('固定輪班')" class="min-h-[44px] px-3.5 sm:px-4 py-2 rounded-lg text-sm font-bold transition text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95">
                        🔄 固定輪班
                    </button>
                    <button id="btn-random" onclick="switchMode('隨機排班')" class="min-h-[44px] px-3.5 sm:px-4 py-2 rounded-lg text-sm font-bold transition shadow-sm bg-amber-500 text-white dark:text-slate-900 active:scale-95">
                        📋 隨機排班
                    </button>
                </div>

                <!-- 輔助切換群組 (檢視模式 + 深淺色主題) -->
                <div class="flex items-center gap-2">
                    <!-- 檢視切換按鈕 (清單 / 月曆) -->
                    <button id="btn-view-toggle" type="button" onclick="toggleView()" class="min-h-[44px] px-3.5 sm:px-4 py-2 border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#0f172a] hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-bold rounded-xl transition shadow-sm active:scale-95 flex items-center gap-1.5">
                        📊 清單模式
                    </button>

                    <!-- 主題切換按鈕 -->
                    <button id="btn-theme" type="button" onclick="toggleTheme()" class="min-h-[44px] px-3.5 sm:px-4 py-2 border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#0f172a] hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-bold rounded-xl transition shadow-sm active:scale-95 whitespace-nowrap">
                        🌙 深色
                    </button>
                </div>
            </div>

            <!-- 第二列：月份切換導航 -->
            <div class="flex items-center justify-between bg-slate-50 dark:bg-[#0f172a] p-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                <button onclick="changeMonth(-1)" aria-label="上個月" class="min-w-[44px] min-h-[44px] flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition text-slate-700 dark:text-slate-200 text-lg font-extrabold active:scale-90">◀</button>
                <h1 id="year-month-title" class="text-base sm:text-lg font-black text-slate-800 dark:text-slate-100 text-center tracking-wide">載入中...</h1>
                <div class="flex items-center gap-1.5">
                    <button onclick="changeMonth(1)" aria-label="下個月" class="min-w-[44px] min-h-[44px] flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition text-slate-700 dark:text-slate-200 text-lg font-extrabold active:scale-90">▶</button>
                    <button onclick="goToToday()" class="min-h-[44px] px-3 sm:px-4 py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white dark:text-slate-900 text-xs sm:text-sm font-bold rounded-lg shadow transition whitespace-nowrap">今天</button>
                </div>
            </div>

        </div>

        <!-- 當月即時統計條 (手機兩欄/三欄流式，平板電腦六欄) -->
        <div id="stats-bar" class="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-3 text-center text-xs sm:text-sm font-bold">
            <div class="bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-xl py-2 px-1 text-sky-700 dark:text-sky-300 shadow-sm flex flex-col justify-center min-h-[50px]">
                <span class="text-[11px] font-medium opacity-80">早班</span>
                <span class="text-sm sm:text-base font-black"><span id="stat-early">0</span> 天</span>
            </div>
            <div class="bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-xl py-2 px-1 text-indigo-700 dark:text-indigo-300 shadow-sm flex flex-col justify-center min-h-[50px]">
                <span class="text-[11px] font-medium opacity-80">晚班</span>
                <span class="text-sm sm:text-base font-black"><span id="stat-late">0</span> 天</span>
            </div>
            <div class="bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-xl py-2 px-1 text-emerald-700 dark:text-emerald-300 shadow-sm flex flex-col justify-center min-h-[50px]">
                <span class="text-[11px] font-medium opacity-80">休假</span>
                <span class="text-sm sm:text-base font-black"><span id="stat-off">0</span> 天</span>
            </div>
            <div class="bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-xl py-2 px-1 text-emerald-600 dark:text-emerald-400 shadow-sm flex flex-col justify-center min-h-[50px]">
                <span class="text-[11px] font-medium opacity-80">本月收入</span>
                <span id="stat-income" class="text-sm sm:text-base font-black">+$0</span>
            </div>
            <div class="bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-xl py-2 px-1 text-rose-600 dark:text-rose-400 shadow-sm flex flex-col justify-center min-h-[50px]">
                <span class="text-[11px] font-medium opacity-80">本月支出</span>
                <span id="stat-expense" class="text-sm sm:text-base font-black">-$0</span>
            </div>
            <div class="bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-xl py-2 px-1 text-slate-800 dark:text-slate-100 shadow-sm flex flex-col justify-center min-h-[50px]">
                <span class="text-[11px] font-medium opacity-80">本月結餘</span>
                <span id="stat-balance" class="text-sm sm:text-base font-black">$0</span>
            </div>
        </div>

        <!-- 固定循環週期設定面板 -->
        <div id="fixed-settings-panel" class="hidden bg-white dark:bg-[#1e293b] rounded-2xl shadow-sm p-4 mb-3 border border-slate-200 dark:border-slate-700">
            <h2 class="text-sm font-bold text-slate-800 dark:text-slate-100 mb-2 flex items-center gap-1">
                ⚙️ 固定循環週期設定
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
                <div>
                    <label for="setting-base-date" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">起始日 (G2，推算起點)</label>
                    <input type="date" id="setting-base-date" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-base md:text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none min-h-[44px]">
                </div>
                <div class="md:col-span-2">
                    <label for="setting-pattern" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">循環週期 (H2 以下，可用逗號、頓號、空格或換行隔開)</label>
                    <div class="flex gap-2">
                        <input type="text" id="setting-pattern" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-base md:text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none min-h-[44px]" placeholder="例如: 晚班,晚班,休假,休假">
                        <button onclick="saveFixedConfig()" class="min-h-[44px] px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white dark:text-slate-900 text-sm font-bold rounded-xl shadow transition whitespace-nowrap active:scale-95">
                            儲存設定
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 模式提示訊息 -->
        <div id="mode-tip" class="mb-3 text-xs font-medium text-amber-800 dark:text-amber-300 bg-amber-100/70 dark:bg-amber-500/10 p-2.5 rounded-xl border border-amber-200 dark:border-amber-500/30">
            💡 提示：目前檢視【隨機排班】，點擊任一日即可修改班別、節日、收支明細與備註！
        </div>

        <!-- 視圖容器 A：月曆網格視圖 (Grid View) -->
        <div id="view-grid-wrapper">
            <!-- 星期表頭 (只在月曆網格顯示) -->
            <div id="calendar-week-header" class="grid grid-cols-7 bg-slate-200 dark:bg-slate-700 border-t border-x border-slate-200 dark:border-slate-700 rounded-t-2xl text-center font-bold text-slate-700 dark:text-slate-200 text-xs sm:text-sm">
                <div class="py-2.5 text-rose-600 dark:text-rose-400 border-r border-slate-300 dark:border-slate-600">日</div>
                <div class="py-2.5 border-r border-slate-300 dark:border-slate-600">一</div>
                <div class="py-2.5 border-r border-slate-300 dark:border-slate-600">二</div>
                <div class="py-2.5 border-r border-slate-300 dark:border-slate-600">三</div>
                <div class="py-2.5 border-r border-slate-300 dark:border-slate-600">四</div>
                <div class="py-2.5 border-r border-slate-300 dark:border-slate-600">五</div>
                <div class="py-2.5 text-sky-600 dark:text-sky-400">六</div>
            </div>

            <!-- 日曆格子主體 (田字格網格) -->
            <div id="calendar-grid" class="grid grid-cols-7 bg-slate-200 dark:bg-slate-700 border-b border-x border-slate-200 dark:border-slate-700 rounded-b-2xl shadow-sm overflow-hidden">
                <!-- 動態渲染格子 -->
            </div>
        </div>

        <!-- 視圖容器 B：直式清單檢視 (List View，手機最佳體驗) -->
        <div id="calendar-list" class="hidden space-y-2">
            <!-- 動態渲染清單列 -->
        </div>

    </div>

    <!-- 單日排班與多筆收支編輯視窗 (Modal - 手機底部滑出 / 電腦置中) -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 hidden flex flex-col justify-end md:justify-center md:items-center z-50 p-0 md:p-4 transition-opacity">
        <div class="bg-white dark:bg-[#1e293b] text-slate-800 dark:text-slate-100 rounded-t-3xl md:rounded-2xl shadow-2xl w-full max-w-xl max-h-[92vh] flex flex-col overflow-hidden border border-slate-200 dark:border-slate-700 animate-in fade-in duration-200">
            
            <!-- 手機版拖曳飾條 -->
            <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mt-2.5 mb-1 md:hidden"></div>

            <!-- 標題欄 (帶大關閉按鈕) -->
            <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <h3 id="modal-date-title" class="text-base sm:text-lg font-black text-slate-800 dark:text-slate-100">編輯日期資料</h3>
                <button type="button" onclick="closeModal()" class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold active:scale-90" aria-label="關閉">✕</button>
            </div>

            <input type="hidden" id="edit-row" value="">

            <!-- 捲動內容區塊 -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-5">
                <!-- 區塊 A：班別設定 (C 欄) -->
                <section>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-2">A. 班別設定 (C 欄)</label>
                    <div class="grid grid-cols-4 gap-2 mb-2">
                        <button type="button" data-shift="早班" onclick="pickShift('早班')" class="shift-btn min-h-[48px] py-2.5 px-2 rounded-xl text-sm sm:text-base font-extrabold border-2 border-sky-300 dark:border-sky-700 text-sky-700 dark:text-sky-300 hover:bg-sky-50 dark:hover:bg-sky-900/30 transition active:scale-95 flex items-center justify-center">早班</button>
                        <button type="button" data-shift="晚班" onclick="pickShift('晚班')" class="shift-btn min-h-[48px] py-2.5 px-2 rounded-xl text-sm sm:text-base font-extrabold border-2 border-indigo-300 dark:border-indigo-700 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition active:scale-95 flex items-center justify-center">晚班</button>
                        <button type="button" data-shift="休假" onclick="pickShift('休假')" class="shift-btn min-h-[48px] py-2.5 px-2 rounded-xl text-sm sm:text-base font-extrabold border-2 border-emerald-300 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 transition active:scale-95 flex items-center justify-center">休假</button>
                        <button type="button" data-shift="" onclick="pickShift('')" class="shift-btn min-h-[48px] py-2.5 px-2 rounded-xl text-sm sm:text-base font-bold border-2 border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition active:scale-95 flex items-center justify-center">清除</button>
                    </div>
                    <input type="text" id="edit-shift-custom" oninput="onShiftCustomInput()" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-base md:text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none min-h-[44px]" placeholder="自訂班別（例如 A10，或點選上方快捷鍵）">
                </section>

                <!-- 區塊 B：國定假日簡稱 -->
                <section>
                    <label for="edit-holiday" class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">B. 節日簡稱（選填，最多 6 字，寫入 F 欄）</label>
                    <input type="text" id="edit-holiday" maxlength="6" oninput="updatePreview()" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-base md:text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none min-h-[44px]" placeholder="例如 教師節">
                </section>

                <!-- 區塊 C：當日多筆收支明細 -->
                <section>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-400">C. 當日收支明細（支出自動為負、收入自動為正）</label>
                        <button type="button" id="btn-add-expense" onclick="addExpenseRow()" class="min-h-[44px] px-3.5 py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white dark:text-slate-900 text-xs sm:text-sm font-bold rounded-xl shadow transition">➕ 新增一筆</button>
                    </div>
                    <div id="expense-list" class="space-y-2"></div>

                    <label for="edit-memo" class="block text-xs font-bold text-slate-600 dark:text-slate-400 mt-3 mb-1">一般備註（選填，寫入 F 欄）</label>
                    <input type="text" id="edit-memo" oninput="updatePreview()" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-base md:text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none min-h-[44px]" placeholder="輸入額外簡短備忘">
                </section>

                <!-- 即時預覽 -->
                <section class="rounded-xl border border-dashed border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#0f172a] p-3 text-xs space-y-1">
                    <div class="font-bold text-slate-600 dark:text-slate-400">即將寫入 Google Sheets：</div>
                    <div>D 欄 (類別)：<span id="preview-d" class="font-semibold text-amber-700 dark:text-amber-300"></span></div>
                    <div>E 欄 (淨額)：<span id="preview-e" class="font-semibold text-amber-700 dark:text-amber-300"></span></div>
                    <div>F 欄 (備註)：<span id="preview-f" class="font-semibold text-amber-700 dark:text-amber-300 break-all"></span></div>
                </section>
            </div>

            <!-- 底部動作按鈕區 (固定在 Modal 下方，高達 48px 大按鈕易點擊) -->
            <div class="p-3 sm:p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-[#1e293b] flex gap-3 sticky bottom-0">
                <button type="button" onclick="closeModal()" class="flex-1 min-h-[48px] bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 active:scale-95 text-slate-700 dark:text-slate-200 text-base font-bold rounded-xl transition">取消</button>
                <button id="btn-save-record" type="button" onclick="saveRecordData()" class="flex-1 min-h-[48px] bg-amber-500 hover:bg-amber-600 active:scale-95 text-white dark:text-slate-900 text-base font-black rounded-xl shadow-md transition disabled:opacity-60">儲存回寫</button>
            </div>
        </div>
    </div>
